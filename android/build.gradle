group = "com.ssg.ssg_shell"
version = "1.0.2"

buildscript {
    ext.kotlin_version = "1.9.24"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.ssg.ssg_shell"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 23
        // §8.4 体验与性能 4：桥接方法只被 JS 调用，R8 必须保留。
        // 消费方即使换了自己的规则文件也会合并到这条。
        consumerProguardFiles "consumer-rules.pro"
    }

    dependencies {
        // §1.2 addDocumentStartJavaScript、§11.2 getWebViewRenderProcess().terminate()、
        // §11.7 getCurrentWebViewPackage()
        implementation "androidx.webkit:webkit:1.12.1"
        // §4 / §10.2 进程级前后台判定，不依赖宿主 Activity
        implementation "androidx.lifecycle:lifecycle-process:2.8.7"
        // §8.4 ComponentActivity + OnBackPressedDispatcher（§9.1 预测性返回）
        // §7.3 ActivityResultContracts.PickVisualMedia
        implementation "androidx.activity:activity-ktx:1.9.3"
        // §9.6 系统 SplashScreen
        implementation "androidx.core:core-splashscreen:1.0.1"
        // §8.4 体验与性能 1：进程启动即预创建 WebView，不等 Dart
        implementation "androidx.startup:startup-runtime:1.2.0"

        testImplementation "org.jetbrains.kotlin:kotlin-test"
        testImplementation "junit:junit:4.13.2"
        // WebEventParser 用 org.json 解析 §3.1 的 payload。单元测试的 android.jar 里
        // 那套是会抛 "not mocked" 的桩，所以把真的那份放进测试 classpath。
        testImplementation "org.json:json:20231013"
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen { false }
                showStandardStreams = true
            }
        }
    }
}
