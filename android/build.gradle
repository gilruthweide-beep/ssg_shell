group = "com.ssg.ssg_shell"
version = "1.0.2"

buildscript {
    ext.kotlin_version = "2.2.20"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.10.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.ssg.ssg_shell"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 23
        // §8.4 Performance 4: R8 must retain bridge methods called only by JavaScript.
        // This rule is merged even when the consuming application uses its own rules file.
        consumerProguardFiles "consumer-rules.pro"
    }

    dependencies {
        // §1.2 addDocumentStartJavaScript、§11.2 getWebViewRenderProcess().terminate()、
        // §11.7 getCurrentWebViewPackage()
        implementation "androidx.webkit:webkit:1.12.1"
        // §4 / §10.2 Process-level foreground/background tracking, independent of the host Activity.
        implementation "androidx.lifecycle:lifecycle-process:2.8.7"
        // §8.4 ComponentActivity + OnBackPressedDispatcher for §9.1 predictive back.
        // §7.3 ActivityResultContracts.PickVisualMedia
        implementation "androidx.activity:activity-ktx:1.9.3"
        // §9.6 System SplashScreen.
        implementation "androidx.core:core-splashscreen:1.0.1"
        // §8.4 Performance 1: create the WebView at process startup without waiting for Dart.
        implementation "androidx.startup:startup-runtime:1.2.0"

        testImplementation "org.jetbrains.kotlin:kotlin-test"
        testImplementation "junit:junit:4.13.2"
        // WebEventParser uses org.json for §3.1 payloads. The unit-test android.jar implementation
        // contains stubs that throw "not mocked", so use a real implementation on the test classpath.
        testImplementation "org.json:json:20231013"
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen { false }
                showStandardStreams = true
            }
        }
    }
}
